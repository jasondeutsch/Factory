services:
  comms:
    build:
      context: .
    ports:
      - "127.0.0.1:${COMMS_PORT:-8090}:8080"
    volumes:
      - comms-data:/data
    environment:
      COMMS_ADDR: ":8080"
      COMMS_DB_PATH: /data/state.db
      COMMS_AUTH_TOKEN: "${COMMS_AUTH_TOKEN:-}"
    healthcheck:
      test: ["CMD", "/comms", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s

  sqlite-admin:
    image: ghcr.io/coleifer/sqlite-web@sha256:ec3c5811216fa5f7313e9f7269e1a1ca9c1f24f5f5ac3668c1f398c97afa362b
    user: "65532:65532"
    entrypoint: ["sqlite_web", "--host", "0.0.0.0", "--no-browser", "--read-only"]
    command: ["/data/state.db"]
    ports:
      - "127.0.0.1:${COMMS_ADMIN_PORT:-8091}:8080"
    volumes:
      - type: volume
        source: comms-data
        target: /data
        read_only: true
        volume:
          nocopy: true
    depends_on:
      comms:
        condition: service_healthy
volumes:
  comms-data:
