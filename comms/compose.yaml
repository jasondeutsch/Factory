services:
  comms:
    build:
      context: .
    ports:
      - "127.0.0.1:${COMMS_PORT:-8090}:8080"
    environment:
      COMMS_ADDR: ":8080"
      COMMS_DB_PATH: /data/state.db
      COMMS_AUTH_TOKEN: "${COMMS_AUTH_TOKEN:-}"
    healthcheck:
      test: ["CMD", "/comms", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
